<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">

    <title>Reset Password - Scheme Finder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: #1e293b;
        }

        .reset-container {
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #dbeafe;
            color: #2563eb;
            font-size: 30px;
        }

        h1 {
            margin-bottom: 12px;
            text-align: center;
            font-size: 28px;
            line-height: 1.3;
            color: #0f172a;
        }

        .subtitle {
            margin-bottom: 28px;
            text-align: center;
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #0f172a;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            min-height: 50px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #message.visible {
            display: block;
        }

        #message.success {
            color: #166534;
            background: #dcfce7;
        }

        #message.error {
            color: #991b1b;
            background: #fee2e2;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #2563eb;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .reset-container {
                padding: 28px 22px;
                border-radius: 16px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="reset-container">
        <div class="logo" aria-hidden="true">🔐</div>

        <h1>Reset your password</h1>

        <p class="subtitle">
            Create a new password for your Scheme Finder account.
        </p>

        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New password</label>
                <input
                    id="newPassword"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <input
                    id="confirmPassword"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button type="submit" id="resetButton">
                Reset Password
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <a href="login.html" class="back-link">
            Back to Login
        </a>
    </main>

    <script>
    (() => {
        "use strict";

        // Replace this IP with your computer's IPv4 address.
        // Use 127.0.0.1 only when testing in the same computer.
        const API_BASE = "https://scheme-finder-csp-backend.onrender.com";

        const token = new URLSearchParams(location.search).get("token");
        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("resetButton");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "visible " + type;
        }

        if (!token) {
            showMessage(
                "The reset link is missing or invalid. Please request a new one.",
                "error"
            );
            button.disabled = true;
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const password =
                document.getElementById("newPassword").value;
            const confirm =
                document.getElementById("confirmPassword").value;

            if (!token) {
                showMessage("Please request a new reset link.", "error");
                return;
            }

            if (password.length < 8) {
                showMessage(
                    "Your password must contain at least 8 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirm) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";
            message.className = "";

            try {
                const response = await fetch(
                    `${API_BASE}/api/auth/reset-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        cache: "no-store",
                        body: JSON.stringify({
                            token: token,
                            new_password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    showMessage(
                        data.message ||
                        "Unable to reset your password. The link may have expired.",
                        "error"
                    );
                    return;
                }

                showMessage(
                    data.message || "Password updated successfully!",
                    "success"
                );

                form.reset();

                // Remove the token from the visible URL.
                history.replaceState(null, "", location.pathname);

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {
                console.error("Password reset failed:", error);

                showMessage(
                    "Cannot connect to the server. Check your network and try again.",
                    "error"
                );
            } finally {
                button.disabled = false;
                button.textContent = "Reset Password";
            }
        });
    })();
    </script>
</body>
</html>
