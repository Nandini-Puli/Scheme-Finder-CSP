<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scheme Finder - Schemes &amp; Opportunities</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet">

<script src="../js/auth_guard.js"></script>
<link rel="stylesheet" href="../css/appearance.css">
<script src="../js/appearance.js"></script>

<style>

/* ==============================
   BASIC RESET
================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Poppins","Segoe UI",Arial,sans-serif;
    background:#eef7ff;
    color:#124b84;
}


/* ==============================
   SIDEBAR
================================= */

.sidebar{
    position:fixed;
    top:0;
    left:0;

    width:260px;
    height:100vh;

    background:linear-gradient(
        180deg,
        #07509d 0%,
        #064b98 55%,
        #063f82 100%
    );

    color:white;

    padding:18px 15px;

    z-index:1000;

    overflow:hidden;
}

.sidebar::after{
    content:"";

    position:absolute;

    left:-70px;
    bottom:60px;

    width:350px;
    height:300px;

    background:
        linear-gradient(
            rgba(255,255,255,0.06),
            rgba(255,255,255,0.01)
        );

    border-radius:50% 50% 0 0;

    transform:translateY(80px);

    z-index:1;
}


/* ==============================
   LOGO - EMBLEM + SCHEME FINDER
================================= */

.logo{
    display:flex;

    align-items:center;

    gap:15px;

    height:65px;

    padding-left:10px;

    margin-bottom:25px;

    position:relative;

    z-index:3;
}

.logo img{
    width:42px;
    height:52px;

    object-fit:contain;

    filter:brightness(0) invert(1);
}

.logo-text{
    font-size:24px;

    font-weight:600;

    color:white;

    white-space:nowrap;
}


/* ==============================
   MENU
================================= */

.menu{
    display:flex;

    flex-direction:column;

    gap:8px;

    padding:0;

    position:relative;

    z-index:3;
}

.menu a{
    width:100%;

    height:52px;

    display:flex;

    align-items:center;

    gap:20px;

    padding:0 14px;

    color:white;

    text-decoration:none;

    font-size:16px;

    font-weight:500;

    border-radius:9px;

    transition:.25s ease;
}

.menu a i{
    width:26px;

    text-align:center;

    font-size:24px;
}

.menu a:hover{
    background:rgba(255,255,255,.12);
}

.menu a.active{
    background:linear-gradient(
        90deg,
        #168cff,
        #1685f4
    );

    box-shadow:
    0 5px 15px rgba(0,126,255,.25);
}


/* ==============================
   BOTTOM TEXT
================================= */

.sidebar-bottom{
    position:absolute;

    bottom:25px;

    left:0;

    width:100%;

    text-align:center;

    z-index:3;
}

.sidebar-bottom p{
    color:white;

    font-size:14px;

    line-height:1.6;

    opacity:.95;
}

.india-line{
    width:90px;

    height:20px;

    margin:8px auto 0;

    position:relative;
}

.india-line::before{
    content:"";

    position:absolute;

    width:75px;
    height:5px;

    background:#ff9933;

    border-radius:50%;

    left:8px;
    top:2px;

    transform:rotate(-10deg);
}

.india-line::after{
    content:"";

    position:absolute;

    width:75px;
    height:5px;

    background:#138808;

    border-radius:50%;

    left:8px;
    top:11px;

    transform:rotate(-10deg);
}


/* ==============================
   HEADER
================================= */

.header{
    position:fixed;

    top:0;
    left:260px;
    right:0;

    height:73px;

    background:white;

    border-bottom:1px solid #dceaf5;

    display:flex;

    align-items:center;

    justify-content:flex-end;

    padding:0 28px;

    z-index:900;
}


/* ==============================
   HEADER RIGHT
================================= */

.header-right{
    display:flex;

    align-items:center;

    gap:25px;
}


/* ==============================
   SEARCH
================================= */

.search-box{
    width:300px;

    height:43px;

    border:1px solid #d8e5f1;

    border-radius:25px;

    display:flex;

    align-items:center;

    padding:0 17px;

    background:white;
}

.search-box i{
    color:#1473ca;

    font-size:17px;

    margin-right:11px;
}

.search-box input{
    border:none;

    outline:none;

    width:100%;

    font-size:13px;

    color:#315b84;
}

.search-box input::placeholder{
    color:#7188a0;
}


/* ==============================
   NOTIFICATION
================================= */

.notification{
    width:40px;
    height:40px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    color:#0755a0;

    font-size:23px;
}

.notification-number{
    position:absolute;

    top:0;
    right:0;

    width:17px;
    height:17px;

    background:#e51f36;

    color:white;

    font-size:10px;

    font-weight:bold;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    border:2px solid white;
}


/* ==============================
   PROFILE
================================= */

.profile{
    display:flex;

    align-items:center;

    gap:10px;

    cursor:pointer;
}

.profile-circle{
    width:48px;
    height:48px;

    border-radius:50%;

    background:#e4f1ff;

    border:2px solid #d7eafa;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#0759a5;

    font-size:26px;
}

.profile-name{
    font-size:16px;

    font-weight:600;

    color:#08457f;
}

.profile-arrow{
    font-size:13px;

    color:#0756a0;
}


/* ==============================
   MAIN AREA
================================= */

.main{
    margin-left:260px;

    padding-top:73px;

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #eaf6ff,
        #f5fbff
    );
}

.content{
    padding:30px 30px 40px;
}


/* ==============================
   PAGE TITLE
================================= */

.page-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:22px;
}

.title-area{
    display:flex;

    align-items:center;

    gap:18px;
}

.title-icon{
    width:53px;
    height:53px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#0875dc;

    font-size:36px;
}

.title-area h1{
    font-size:30px;

    color:#06447f;

    margin-bottom:5px;
}

.title-area p{
    color:#547395;

    font-size:15px;
}


/* ==============================
   TOTAL SAVED
================================= */

.total-box{
    width:288px;

    height:92px;

    background:#f7fbff;

    border:1px solid #d9e9f5;

    border-radius:12px;

    display:flex;

    align-items:center;

    gap:15px;

    padding:14px 20px;
}

.total-icon{
    width:53px;
    height:53px;

    border-radius:50%;

    background:#e4f2ff;

    color:#0875dc;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:24px;
}

.total-text small{
    display:block;

    color:#174f84;

    font-size:13px;

    font-weight:600;

    margin-bottom:5px;
}

.total-text strong{
    display:block;

    font-size:26px;

    color:#06447f;
}


/* ==============================
   SAVED SCHEMES GRID
================================= */

.scheme-grid{
    display:grid;
    
    grid-template-columns:
    1fr 1fr;

    gap:20px;
}


/* ==============================
   SCHEME CARD
================================= */

.scheme-card{
    background:white;

    border:1px solid #d9e7f2;

    border-radius:12px;

    padding:16px 18px;

    min-height:300px;

    box-shadow:
    0 3px 12px rgba(28,94,143,.05);
}


/* ==============================
   CARD TOP
================================= */

.card-top{
    display:flex;

    align-items:center;

    justify-content:space-between;
}

.scheme-heading{
    display:flex;

    align-items:center;

    gap:18px;
}

.scheme-icon{
    width:62px;
    height:62px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:27px;
}

.education{
    background:#dcefff;
    color:#0875dc;
}

.farmer{
    background:#d7f8e6;
    color:#14955c;
}

.women{
    background:#ffdced;
    color:#e62680;
}

.health{
    background:#e5d8ff;
    color:#6632d6;
}

.scheme-name h2{
    color:#07457f;

    font-size:20px;

    margin-bottom:8px;
}

.category{
    display:inline-block;

    padding:5px 12px;

    border-radius:7px;

    font-size:12px;

    font-weight:600;
}

.category.education-tag{
    color:#0875d4;
    background:#e4f3ff;
}

.category.farmer-tag{
    color:#16955b;
    background:#e1f8eb;
}

.category.women-tag{
    color:#e32983;
    background:#ffe3f1;
}

.category.health-tag{
    color:#6637d0;
    background:#ede5ff;
}


/* ==============================
   SAVED
================================= */

.saved{
    color:#0872d7;

    font-size:14px;

    display:flex;

    align-items:center;

    gap:8px;

    font-weight:600;
}

.saved i{
    font-size:18px;
}


/* ==============================
   DESCRIPTION
================================= */

.description{
    margin-top:14px;

    font-size:15px;

    line-height:1.65;

    color:#496b8f;

    min-height:50px;
}


/* ==============================
   BOTTOM
================================= */

.card-bottom{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:20px;
}

.deadline{
    display:flex;

    align-items:center;

    gap:11px;

    color:#e22b55;
}

.deadline i{
    font-size:20px;
}

.deadline-title{
    font-size:13px;

    font-weight:600;

    margin-bottom:3px;
}

.deadline-date{
    font-size:13px;

    font-weight:600;
}


/* ==============================
   BUTTONS
================================= */

.card-buttons{
    display:flex;

    gap:18px;
}

.btn{
    height:45px;

    padding:0 20px;

    border-radius:8px;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;
}

.view-btn{
    background:white;

    border:1.5px solid #2380df;

    color:#0870d3;

    min-width:153px;
}

.remove-btn{
    background:#0875e9;

    color:white;

    border:1px solid #0875e9;

    min-width:132px;
}

.view-btn:hover{
    background:#eef7ff;
}

.remove-btn:hover{
    background:#0668d2;
}


/* ==============================
   RESPONSIVE
================================= */

@media(max-width:1100px){

    .scheme-grid{
        grid-template-columns:1fr;
    }

    .search-box{
        width:230px;
    }
}


@media(max-width:800px){

    .sidebar{
        width:260px;
    }

    .header{
        left:260px;
    }

    .main{
        margin-left:260px;
    }

    .page-top{
        align-items:flex-start;

        flex-direction:column;

        gap:20px;
    }
}


@media(max-width:600px){

    .sidebar{
        width:230px;
    }

    .header{
        left:230px;

        padding:0 15px;
    }

    .main{
        margin-left:230px;
    }

    .search-box{
        display:none;
    }

    .profile-name,
    .profile-arrow{
        display:none;
    }

    .content{
        padding:22px 15px;
    }

    .title-area h1{
        font-size:25px;
    }

    .scheme-grid{
        grid-template-columns:1fr;
    }

    .scheme-card{
        padding:16px;
    }

    .card-bottom{
        flex-direction:column;

        align-items:flex-start;

        gap:15px;
    }

    .card-buttons{
        width:100%;
    }

    .btn{
        flex:1;
    }

    .scheme-heading{
        gap:11px;
    }

    .scheme-name h2{
        font-size:17px;
    }

    .total-box{
        width:100%;
    }

}


.saved-schemes-message {
    grid-column: 1 / -1;
    padding: 24px;
    text-align: center;
    color: #0759a5;
    font-size: 15px;
}
.profile { cursor: pointer; }
</style>

</head>

<aside class="sidebar">

        </span>

    </div>


    <!-- MENU -->

    <nav class="menu">

<!-- =================================

<header class="header">

    <div class="header-right">


        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="SchemesSearch"
                placeholder="Search schemes by name or category..."
                aria-label="Search schemes by name or category"
                autocomplete="off"
            >

        <div class="notification">

            <i class="fa-regular fa-bell"></i>

            <span class="notification-number" id="unreadAlertCount">0</span>

        <div class="profile" id="profileNavigation" role="link" tabindex="0" title="Open profile">

        </div>

</header>



<!-- =================================
    MAIN
================================== -->

<main class="main">

<div class="content">


    <!-- PAGE TITLE -->

    <div class="page-top">

        <div class="title-area">

            <div class="title-icon">

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>

            <div>

                <h1>
                    Schemes &amp; Opportunities
                </h1>

                <p>
                    Browse schemes available from Central Government.
                    Search by scheme name or category and save schemes for later!
                </p>

            </div>

        </div>

    </div>
    <!-- =================================
        SCHEME GRID
    ================================== -->

</div>

</main>


<script>
(() => {
    "use strict";

    const API_BASE = "http://127.0.0.1:5000/api";
    const grid = document.getElementById("SchemesGrid");
    const searchInput = document.getElementById("SchemesSearch");
    const profile = document.getElementById("profileNavigation");

    let availableSchemes = [];
    let savedSchemeIds = new Set();

    function text(value, fallback = "Not provided") {
        if (value === null || 
            value === undefined || 
            String(value).trim() === ""
        ) return fallback;
        return String(value).trim();
    }

    function addText(parent, tag, className, value, fallback = "Not provided") {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = text(value, fallback);
        parent.appendChild(element);
        return element;
    }

    function icon(className) {
        const element = document.createElement("i");
        element.className = className;
        element.setAttribute("aria-hidden", "true");
        return element;
    }

    function categoryIcon(category) {
        const value = String(category || "").toLowerCase();
        if (value.includes("education") || value.includes("internship")) return "fa-solid fa-graduation-cap";
        if (value.includes("health")) return "fa-solid fa-heart-pulse";
        if (value.includes("unemployed") || value.includes("entrepreneurship")) return "fa-solid fa-briefcase";
        if (value.includes("agri") || value.includes("farm")) return "fa-solid fa-seedling";
        return "fa-solid fa-landmark";
    }

    function showMessage(message, isError = false) {
        grid.replaceChildren();
        const p = document.createElement("p");
        p.className = "schemes-message";
        p.textContent = message;
        if (isError) p.style.color = "#b91c1c";
        grid.appendChild(p);
    }

    function createCard(scheme) {
        const id = scheme.scheme_id ?? scheme.id;
        const name = scheme.scheme_name || scheme.name || "Unnamed scheme";
        const category = scheme.category || "General";

        const card = document.createElement("article");
        card.className = "scheme-card";
        card.dataset.schemeId = String(id ?? "");

        const top = document.createElement("div");
        top.className = "card-top";
        const heading = document.createElement("div");
        heading.className = "scheme-heading";
        const schemeIcon = document.createElement("div");
        schemeIcon.className = "scheme-icon education";
        schemeIcon.appendChild(icon(categoryIcon(category)));

        const nameBox = document.createElement("div");
        nameBox.className = "scheme-name";
        addText(nameBox, "h2", "", name);
        addText(nameBox, "span", "category education-tag", category);
        heading.append(schemeIcon, nameBox);

        const badge = document.createElement("div");
        badge.className = "saved";
        badge.append(icon("fa-solid fa-bookmark"), document.createTextNode(" Scheme"));
        top.append(heading, badge);
        card.appendChild(top);

        addText(card, "p", "description", scheme.description, "Description has not been provided.");

        const bottom = document.createElement("div");
        bottom.className = "card-bottom";

        const deadline = document.createElement("div");
        deadline.className = "deadline";
        deadline.appendChild(icon("fa-regular fa-calendar"));
        const deadlineText = document.createElement("div");
        addText(deadlineText, "div", "deadline-title", "Deadline");
        addText(deadlineText, "div", "deadline-date", scheme.deadline, "Not specified");
        deadline.appendChild(deadlineText);

        const buttons = document.createElement("div");
        buttons.className = "card-buttons";

        const view = document.createElement("button");
        view.type = "button";
        view.className = "btn view-btn";
        view.append(icon("fa-regular fa-eye"), document.createTextNode(" View Details"));
        
        view.addEventListener("click", async () => {
            if (id === undefined || id === null || id === "") {
                alert("This scheme has no scheme ID.");
                return;
            }

        view.disabled = true;

        try {
            const response = await fetch(
                `${API_BASE}/schemes/${encodeURIComponent(id)}/view`,
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            const data = await response.json().catch(() => ({}));

            if (response.status === 401) {
                console.warn("Please log in to record scheme views.");
            } else if (!response.ok) {
                console.error(
                    "Could not record scheme view:",
                    data.message
                ); 
            } else {
                console.log("View recorded:", data.view_count);
            }
        } catch (error) {
            console.error("View tracking error:", error);
        } finally {
            window.location.href =
                `scheme_details.html?id=${encodeURIComponent(id)}`;
            }
        });


        const save = document.createElement("button");
        save.type = "button";
        // Reuse the existing blue button styling while changing the action to Save Scheme.
        save.className = "btn remove-btn";
        const alreadySaved = savedSchemeIds.has(String(id));
        save.append(
            icon(alreadySaved ? "fa-solid fa-bookmark" : "fa-regular fa-bookmark"),
            document.createTextNode(alreadySaved ? " Saved" : " Save Scheme")
        );
        save.disabled = alreadySaved;
        if (alreadySaved) save.title = "This scheme is already saved";
        save.addEventListener("click", () => saveScheme(id, save));

        buttons.append(view, save);
        bottom.append(deadline, buttons);
        card.appendChild(bottom);
        return card;
    }

    function renderSchemes() {
        const query = (searchInput?.value || "").trim().toLocaleLowerCase();
        const filtered = availableSchemes.filter(scheme => {
            const name = String(scheme.scheme_name || scheme.name || "").toLocaleLowerCase();
            const category = String(scheme.category || "").toLocaleLowerCase();
            return name.includes(query) || category.includes(query);
        });

        grid.replaceChildren();
        if (!availableSchemes.length) {
            showMessage("No schemes are currently available in the admin schemes list.");
            return;
        }
        if (!filtered.length) {
            showMessage("No schemes match your search.");
            return;
        }
        filtered.forEach(scheme => grid.appendChild(createCard(scheme)));
    }

    async function loadSavedSchemeIds() {
        try {
            const response = await fetch(`${API_BASE}/saved-schemes`, {
                method: "GET",
                credentials: "include",
                headers: { "Accept": "application/json" }
            });
            if (!response.ok) return;

            const data = await response.json().catch(() => ({}));
            const rows = Array.isArray(data) ? data :
                Array.isArray(data.schemes) ? data.schemes :
                Array.isArray(data.saved_schemes) ? data.saved_schemes : [];

            savedSchemeIds = new Set(rows.map(row => {
                const scheme = row.scheme || row;
                return row.scheme_id ?? scheme.scheme_id ?? scheme.id;
            }).filter(id => id !== undefined && id !== null).map(String));
        } catch (error) {
            console.warn("Could not load saved scheme IDs:", error);
        }
    }

    async function loadSchemes() {
        showMessage("Loading available schemes...");
        try {
            // GET /api/schemes must read the available schemes from adminschemes.
            const response = await fetch(`${API_BASE}/schemes`, {
                method: "GET",
                credentials: "include",
                headers: { "Accept": "application/json" }
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.message || `Could not load schemes (${response.status}).`);
            }

            availableSchemes = Array.isArray(data) ? data :
                Array.isArray(data.schemes) ? data.schemes : [];
            await loadSavedSchemeIds();
            renderSchemes();
        } catch (error) {
            console.error("Failed to load schemes:", error);
            showMessage(error.message || "Unable to load schemes. Check your Flask API.", true);
        }
    }

    async function saveScheme(id, button) {
        if (id === undefined || id === null || id === "") {
            alert("This scheme has no scheme ID.");
            return;
        }
        if (savedSchemeIds.has(String(id))) {
            alert("You have already saved this scheme.");
            return;
        }

        button.disabled = true;
        button.textContent = "Saving...";
        try {
            const response = await fetch(`${API_BASE}/saved-schemes`, {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ scheme_id: id })
            });
            const data = await response.json().catch(() => ({}));
            if (response.status === 401) throw new Error("Please log in to save schemes.");
            if (!response.ok) throw new Error(data.message || `Could not save scheme (${response.status}).`);

            savedSchemeIds.add(String(id));
            button.replaceChildren(icon("fa-solid fa-bookmark"), document.createTextNode(" Saved"));
            button.title = "This scheme is already saved";
            button.disabled = true;
        } catch (error) {
            console.error("Failed to save scheme:", error);
            button.disabled = false;
            button.replaceChildren(icon("fa-regular fa-bookmark"), document.createTextNode(" Save Scheme"));
            alert(error.message || "Unable to save scheme. Check your Flask API.");
        }
    }
    
const profileName = document.getElementById("profileUserName");

async function loadProfileName() {
    console.log("Loading profile name...");

    if (!profileName) {
        console.error("Element #profileUserName was not found.");
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/user/profileusername`, {
            method: "GET",
            credentials: "include",
            headers: { "Accept": "application/json" }
        });

        console.log("Profile API status:", response.status);

        const data = await response.json();
        console.log("Profile API response:", data);

        if (!response.ok) {
            profileName.textContent = "Profile";
            return;
        }

        const user = data.user || data.profile || data;

        profileName.textContent =
            user.full_name || "Profile";

    } catch (error) {
        console.error("Profile loading error:", error);
        profileName.textContent = "Profile";
    }
}
loadProfileName();

    if (searchInput) searchInput.addEventListener("input", renderSchemes);
    if (profile) {
        const goToProfile = () => { window.location.href = "profile.html"; };
        profile.addEventListener("click", goToProfile);
        profile.addEventListener("keydown", event => {

    }

    loadSchemes();
})();
